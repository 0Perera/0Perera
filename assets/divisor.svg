<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 18" width="1000" height="18" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .p { font: 700 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill: #3fb950; }
  </style>
  <text class="p" x="0" y="13">$</text>
  <line x1="16" y1="9" x2="16" y2="9" stroke="#1f2f3a" stroke-width="1.5">
    <animate attributeName="x2" from="16" to="1000" dur="0.9s" begin="0.1s" fill="freeze"
             calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </line>
  <rect x="16" y="2" width="7" height="13" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="x" from="16" to="1000" dur="0.9s" begin="0.1s" fill="freeze"
             calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <animate attributeName="opacity" to="0" dur="0.2s" begin="1.0s" fill="freeze"/>
  </rect>
</svg>
